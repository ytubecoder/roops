# hello-watchdog — pilot example (type=watchdog). Permanent regression
# fixture under examples/; NEVER installed to launchd
# (docs/INTERFACES.md §1). See README.md for how to run it supervised, and
# SPEC.md for the intake interview this loop was built from.
name=hello-watchdog
description="Pilot: curl-probes a single target (target.txt) and escalates to diagnosis on failure"
type=watchdog
engine=codex
schedule=interval:15m
# workdir=$LOOPS_ROOT
timeout_s=120
# enabled=true
# retention_days=30
# retry_transient=1
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="Pilot/regression fixture (docs/HARNESS_PLAN.md step 6). The probe itself (curl) runs unsandboxed inside precheck.sh, which IS the job for type=watchdog (docs/INTERFACES.md §4.1) — it is not governed by perm_network, which only bounds the diagnosis engine's own access. The diagnosis engine only interprets already-captured PRECHECK OUTPUT text, so it needs no elevated axis."
