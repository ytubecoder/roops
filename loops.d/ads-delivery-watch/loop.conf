# ads-delivery-watch — catches the failure mode every other ads loop is blind to.
#
# The account has gone dark twice on a declined billing-threshold charge:
# 2026-07-30 (nine days dark, noticed by Generalissimo) and 2026-08-28 (found
# three days late, by hand, while answering an unrelated question). The five
# daily ads loops ran normally through BOTH. That is not negligence on their
# part — it is structural. A dead account has zero spend, which passes every
# cap check, and zero impressions, which yields no CTR verdict. It scores
# perfectly on everything they measure.
#
# So this loop asks the two questions none of them ask: did a complete day pass
# with campaigns ENABLED and nothing served, and has actual month-to-date spend
# crossed the hard network cap. Both are arithmetic, so precheck.sh decides them
# and the engine only writes up an alarm that has already been established.
name=ads-delivery-watch
owner=maguyva-marketing
description="Watches Google Ads for the two conditions the ads loops cannot see: a complete day with campaigns ENABLED and zero spend (the payments-stop signature), and actual month-to-date spend at or over the hard network cap that nothing on our side can enforce."
type=watchdog
engine=codex

# Cadence: once daily, morning. The check reads only COMPLETE days (today is
# excluded — a partial day legitimately reads near zero in the morning and would
# alarm every run), so a second run in the same day would re-report the same
# verdict without learning anything. One read per new complete day is exactly
# the available resolution. Calendar times are LOCAL (INTERFACES.md §5.1).
schedule=daily:09:00

timeout_s=300
requires="probe:ads-delivery-watch"

# Retention long because these runs are the evidence trail for how long an
# outage lasted — the thing we could not reconstruct for the July occurrence.
retention_days=730

# --- Permission axes (INTERFACES.md §5.2) ---
# report_only is correct here, unlike the ads-* loops: this loop writes no
# action set and materializes no files of its own. The probe call inside
# precheck.sh is the job (§4.1) and is not governed by perm_network; the engine
# only ever reads already-captured precheck text.
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none

notes="Deliberately alerts and never acts. Pausing a campaign is an order, and this loop places none. The standing rule was amended narrowly on 2026-08-31 to let exactly one scheduled job (ads-hard-cut) pause at a $4,000 circuit-breaker threshold — a permission this loop does not take, and which sits far above the network caps this one watches. Confirming the cause is human-only regardless: Google's billing pages are passkey-walled behind cross-origin payment iframes, and the API does not model payment failure at all, which is why absence of spend is the only signal that exists."
