# ads-experiment-candidates — weekly proposal drafts for ads experiments.
#
# Monday 10:00 local, the precheck calls probe:ads-experiment-tick with
# job=candidates. Drafts are proposals on the GC experiment page. Dry-run
# is forced. Nothing here places, changes or pauses an ad.
name=ads-experiment-candidates
owner=maguyva-marketing
description="Weekly candidate drafts for ads experiments via probe:ads-experiment-tick job=candidates. AI drafts are proposals only, shown on the GC experiment page. Dry-run is forced. Never places, changes or pauses an ad."
type=watchdog
engine=codex
schedule=weekly:mon:10:00
timeout_s=900
requires="probe:ads-experiment-tick"
retention_days=90

perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=allowlist
exec_allowlist="bin/probe ads-experiment-tick"
remote_mutation_justification="Writes experiment-controller ledger rows in GC's ads.db on llm (candidate drafts and the candidates job run). It never places, changes or pauses an ad: the probe forces dry-run, and the GC CLI refuses anything else. AI drafts are proposals only. The design is maguyva-marketing openspec/changes/add-ads-experiment-controller D3."
notes="AI drafts are proposals only, shown on the GC experiment page. Kill switch: loopctl set-schedule ads-experiment-candidates manual, or remove the probe from llm."
