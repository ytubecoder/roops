# ads-experiment-controller — observe and simulate the ads experiment cycle.
#
# Every 30 minutes the precheck calls probe:ads-experiment-tick for collect,
# evaluate and reconcile. Dry-run is forced. No model places, changes or
# pauses an ad. A quiet tick is a zero-token green heartbeat; the engine
# only writes up a failure.
name=ads-experiment-controller
owner=maguyva-marketing
description="Observe and simulate the ads experiment cycle every 30 min: collect, evaluate and reconcile via probe:ads-experiment-tick. Dry-run is forced. Quiet = heartbeat; transport or receipt failures become findings. Never places, changes or pauses an ad."
type=watchdog
engine=codex
schedule=interval:30m
timeout_s=900
requires="probe:ads-experiment-tick"
retention_days=90

perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=allowlist
exec_allowlist="bin/probe ads-experiment-tick"
remote_mutation_justification="Writes experiment-controller ledger rows in GC's ads.db on llm (observations, decisions, simulated commands, job runs). It never places, changes or pauses an ad: the probe forces dry-run, and the GC CLI refuses anything else. The design is maguyva-marketing openspec/changes/add-ads-experiment-controller D3."
notes="Kill switches: run loopctl set-schedule ads-experiment-controller manual, or remove the probe from llm. No new ads run until the controller is ready and proposing, and the operator has set the test budget (2026-10-29)."
