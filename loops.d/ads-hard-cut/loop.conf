# ads-hard-cut — the one loop in the fleet with a write path, and it only ever
# pauses.
#
# Google spent $1,465.51 in August 2026 against a $900 "hard" network cap and
# nothing stopped it. That was not drift: console/ads/budget.py has no pause
# logic at all and never had any. The cap only ever refused orders WE place
# through Growth Console. Campaigns spend their configured daily budgets
# regardless of any number we hold, so "hard cap" was a gate on our own writes
# wearing the name of a brake.
#
# This installs a brake. It reads program-wide ACTUAL month-to-date spend and,
# at or over ads.hard_cut_usd ($4,000), pauses every ENABLED campaign on every
# network. $4,000 is a circuit breaker, not a budget: at the reconciled $56/day
# it is ~2.3x normal spend, about 71 days of ordinary burn. Generalissimo's
# brief, 2026-08-31: "enough to serve as a sanity check but not enough to
# actually slow anything down." It cannot fire in normal operation. It fires
# when something is wrong — a runaway budget edit, a units error, a duplicated
# campaign, an account compromise.
#
# No model is anywhere in the cut path. precheck.sh compares two numbers and
# decides; the engine is invoked afterwards only to write the incident up.
name=ads-hard-cut
owner=maguyva-marketing
description="Program-wide spend circuit breaker: pauses every enabled campaign when actual month-to-date ad spend crosses ads.hard_cut_usd. Reads twice, refuses on any disagreement, and never resumes anything."
type=watchdog
engine=codex

# One hour before ads-delivery-watch, so on a morning where both have something
# to say, the cut is written up first and the delivery report reads against an
# account whose state is already settled. Calendar times are LOCAL
# (INTERFACES.md 5.1).
schedule=daily:08:00

timeout_s=600
requires="probe:ads-spend-read, probe:ads-emergency-pause"

# Long, because these runs are the evidence trail for a program-wide pause:
# what the figure was, which campaigns were touched, and when.
retention_days=730

# --- Permission axes (INTERFACES.md 5.2) ---
# perm_remote_mutation=allowlist is the honest declaration even though the
# mutation is made by precheck.sh through the probe channel rather than by the
# engine: this loop CAN change remote state, and a reader of the fleet must be
# able to see that from the config alone. The engine itself gets the report-only
# floor and cannot reach any of it.
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=allowlist
exec_allowlist="bin/probe ads-spend-read, bin/probe ads-emergency-pause"
remote_mutation_justification="Pauses ad campaigns, and only pauses, when program actual month-to-date spend crosses ads.hard_cut_usd. Narrow amendment to the standing no-scheduled-orders rule, granted by Generalissimo 2026-08-31 (spec 3.2): a scheduled job may place orders only to STOP spending, only at the hard-cut threshold, and only in the pausing direction — never start, resume, raise or create. The writing probe re-checks the threshold itself, requires a fresh nonce minted by the reading probe on the same host, and can act only on campaigns that read observed as ENABLED."

notes="Ships DISARMED: ads.hard_cut_enabled=false and ads.hard_cut_dry_run=true in scheduler/config.json. Arming is a deliberate act after a dry-run proof. Kill switch is hard_cut_enabled alone — do NOT use ads.enabled to disable this loop, because that also blocks every spend-REDUCING order including a human's. Resume after a cut is human-only, always: the loop never un-pauses, not when the month rolls and not when spend resets. Watch the interaction with ads-delivery-watch: a billing outage drives spend to ZERO and therefore can never trip this. The two loops watch opposite failure modes and must stay separate — folding the cutter into the alarm would let a bug in the alarm path pause the program. Spec: docs/superpowers/specs/2026-08-31-budget-reconcile-and-hard-cut-design.md in maguyva-marketing."
