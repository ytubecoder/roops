# ads-intl — daily Google-INTL geo-screen check → per-run action set.
# Clone of the ads-google template (phase 4 of docs/ads-actions-loops-warmstart.md).
# NOT installed until the phase-4 install step; schedule below is the declared trigger.
name=ads-intl
owner=maguyva-marketing
description="Daily Google intl geo-screen check (g-intl experiment: google-intl-en + paused ja/ko): reads the GC ads JSON surface, flags CPC/geo/delivery/budget-guard exceptions, emits a per-run ADI-NN action set (report-only)."
type=agent
engine=claude
# model=  # claude engine default

# Cadence: daily, SECOND in the morning stagger (google -> intl -> reddit -> x
# -> ads-program). Intended reading time ~06:25 ET. Mac system TZ is Asia/Manila
# (+08:00) and launchd calendar times are LOCAL (INTERFACES.md §5.1 + repo
# gotchas): 06:25 EDT (UTC-4) = 18:25 Manila. Registry cadence_days informs
# verdict-due at run time; launchd coalesces missed firings at wake (trap #6),
# so the stagger is best-effort — ads-program checks freshness, not timing.
schedule=daily:18:25

# workdir=$LOOPS_ROOT
timeout_s=900
# enabled=true
# Keep action-set history long-term (the sets live in run dirs; GC surfaces
# them with a size indicator — revisit via that, not by shrinking this).
retention_days=730
# retry_transient=1

# --- Permission axes (INTERFACES.md §5.2) ---
# report_only floor: the only writes are this run's action-set files, written
# by the allowlisted emit script (see notes). No network for the engine — the
# unsandboxed precheck.sh does all fetching. No remote mutation, ever.
perm_fs_write=report_only
perm_network=none
perm_local_exec=allowlist
perm_remote_mutation=none
# Exactly the two shipped, non-mutating, network-free scripts. emit writes +
# self-validates the set; validate re-checks it. `:*` allows the heredoc/args.
exec_allowlist="python3 loops.d/ads-intl/bin/emit_action_set.py:*, python3 loops.d/ads-intl/bin/validate_action_set.py:*"
# credential_env=
# remote_mutation_justification=
notes="Engine=claude (NOT the codex default): the action set must be written as separate md files under the run dir, but the report_only floor gives the MODEL no fs-write under either adapter — codex report_only = read-only sandbox, and the claude floor exposes no Write tool (INTERFACES.md §7.2/§7.3). The only harness-sanctioned way for the engine session to write the files is an allowlisted local command; claude's allowlisted Bash reaches the real fs while codex's would be blocked by its sandbox. Both allowlisted scripts are shipped with the loop, network-free, and non-mutating. Read-only otherwise: never calls record_and_apply, any ads API, git, or CDP/browser."
