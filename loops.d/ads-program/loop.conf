# ads-program — daily CROSS-NETWORK program check → per-run action set.
# Clone of the ads-google template (phase 4 of docs/ads-actions-loops-warmstart.md).
# Program-level only (ADP-): budget totals vs caps (committed binds first),
# ~$1k/mo real-spend soft target, device-policy sync across networks
# (recommend-manual-check, never asserts state it cannot see), bring-up holes.
# Reads the four network loops' newest sets from $LOOPS_ROOT run dirs and
# REFERENCES their action ids; never duplicates their suggested orders. Runs
# LAST in the stagger but never trusts ordering: a missing/stale upstream set
# is reported as a gap in its own set, never a run failure.
# NOT installed until the phase-4 install step; schedule below is the declared trigger.
name=ads-program
owner=maguyva-marketing
description="Daily cross-network ads program check: budget totals vs caps (committed-basis first), real-spend soft target, device-policy sync across networks, bring-up holes; references the network loops' newest sets; emits a per-run ADP-NN action set (report-only)."
type=agent
# engine=codex per Generalissimo 2026-08-05: codex is the preferred general loop
# runner (claude tokens are reserved for development); claude remains supported
# per-loop if codex output quality falls short. Bonus: codex auth is file-based
# (~/.codex/) and works under launchd, where claude's keychain path is broken.
engine=codex
# model=  # codex engine default

# Cadence: daily, LAST in the morning stagger (google -> intl -> reddit -> x
# -> ads-program) so it can read same-day network sets. Intended reading time
# ~07:40 ET. Mac system TZ is Asia/Manila (+08:00) and launchd calendar times
# are LOCAL (INTERFACES.md §5.1 + repo gotchas): 07:40 EDT (UTC-4) = 19:40
# Manila. launchd coalesces missed firings at wake (trap #6): ordering is
# best-effort, which is WHY this loop freshness-checks upstream sets instead of
# trusting the stagger.
schedule=daily:19:40

# workdir=$LOOPS_ROOT
timeout_s=900
# enabled=true
# Keep action-set history long-term (the sets live in run dirs; GC surfaces
# them with a size indicator — revisit via that, not by shrinking this).
retention_days=730
# retry_transient=1

# --- Permission axes (INTERFACES.md §5.2) ---
# report_only floor: the only writes are this run's action-set files, written
# by the allowlisted emit script (see notes). No network for the engine — the
# unsandboxed precheck.sh does all fetching. No remote mutation, ever.
# workdir (not the report_only floor) because engine=codex: codex report_only
# maps to a read-only sandbox (INTERFACES.md 7.2), under which the emit script
# could not write this run's action-set files. Write POLICY stays "only the
# emit script writes, only into this run's dir" — enforced by prompt + artifact
# review under codex (the 5.2-check-5 justification).
perm_fs_write=workdir
perm_network=none
perm_local_exec=allowlist
perm_remote_mutation=none
# Exactly the two shipped, non-mutating, network-free scripts. emit writes +
# self-validates the set; validate re-checks it. `:*` allows the heredoc/args.
exec_allowlist="python3 loops.d/ads-program/bin/emit_action_set.py:*, python3 loops.d/ads-program/bin/validate_action_set.py:*"
# credential_env=
# remote_mutation_justification=
notes="Engine=codex on Generalissimo's 2026-08-05 call (codex = preferred loop runner; claude tokens reserved for development; codex file auth works under launchd). That forces perm_fs_write=workdir: codex report_only = read-only sandbox (7.2) under which the emit script cannot write the action set, so the loop runs workspace-write on $LOOPS_ROOT — the write POLICY (only the two shipped scripts write, only into this run's dir) is enforced by prompt + artifact review under codex, not by a command allowlist. exec_allowlist kept as declared policy even though codex cannot pattern-enforce it (7.2 documented limitation). History: engine was claude 2026-07-28..08-05 because claude's allowlisted-Bash floor was tighter — flip back per-loop if codex output quality falls short. Read-only otherwise: never calls record_and_apply, any ads API, git, or CDP/browser."
