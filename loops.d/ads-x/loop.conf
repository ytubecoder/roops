# ads-x — daily X ads check (CACHE-ONLY by design) → per-run action set.
# Clone of the ads-google template (phase 4 of docs/ads-actions-loops-warmstart.md).
# X has no ads API and its CDP scrape is house-ruled on-demand-only, NEVER cron:
# this loop reads the last x_cache snapshot via the GC surface, labels its age,
# and when staleness exceeds ~3 days its FIRST action is the manual scrape/CSV
# import. It never touches CDP, the OpenTwins Chrome, or the browser lease.
# NOT installed until the phase-4 install step; schedule below is the declared trigger.
name=ads-x
owner=maguyva-marketing
description="Daily X ads check from the last Ads Manager snapshot (x-boost + pending x-take3): opens with a monthly spend ledger (TRUE lifetime decoded from TOTAL REMAINING — never the window column), flags account-lock/staleness/CTR/spend exceptions, emits a per-run ADX-NN action set (report-only, cache-only, never CDP)."
type=agent
# engine=codex per Generalissimo 2026-08-05: codex is the preferred general loop
# runner (claude tokens are reserved for development); claude remains supported
# per-loop if codex output quality falls short. Bonus: codex auth is file-based
# (~/.codex/) and works under launchd, where claude's keychain path is broken.
engine=codex
# model=  # codex engine default

# Cadence: daily, FOURTH in the morning stagger (google -> intl -> reddit -> x
# -> ads-program). Intended reading time ~07:15 ET. Mac system TZ is Asia/Manila
# (+08:00) and launchd calendar times are LOCAL (INTERFACES.md §5.1 + repo
# gotchas): 07:15 EDT (UTC-4) = 19:15 Manila. launchd coalesces missed firings
# at wake (trap #6), so the stagger is best-effort — ads-program checks
# freshness, not timing.
schedule=daily:19:15

# workdir=$LOOPS_ROOT
timeout_s=900
# enabled=true
# Keep action-set history long-term (the sets live in run dirs; GC surfaces
# them with a size indicator — revisit via that, not by shrinking this).
retention_days=730
# retry_transient=1

# --- Permission axes (INTERFACES.md §5.2) ---
# workdir (not the report_only floor) because engine=codex: codex report_only
# maps to a read-only sandbox (§7.2), under which the emit script could not
# write this run's action-set files. workspace-write on $LOOPS_ROOT is the
# narrowest codex sandbox that lets the emit script write into state/runs/.
# POLICY stays "only the emit script writes" — under codex that is enforced by
# prompt + artifact review, not by the sandbox (the §5.2-check-5 justification).
# No network for the engine — the unsandboxed precheck.sh does all fetching.
# No remote mutation, ever.
perm_fs_write=workdir
perm_network=none
perm_local_exec=allowlist
perm_remote_mutation=none
# Exactly the two shipped, non-mutating, network-free scripts. emit writes +
# self-validates the set; validate re-checks it. `:*` allows the heredoc/args.
exec_allowlist="python3 loops.d/ads-x/bin/emit_action_set.py:*, python3 loops.d/ads-x/bin/validate_action_set.py:*"
# credential_env=
# remote_mutation_justification=
notes="Engine=codex on Generalissimo's 2026-08-05 call (codex = preferred loop runner; claude tokens reserved for development; codex file auth works under launchd). That forces perm_fs_write=workdir: codex report_only = read-only sandbox (§7.2) under which the emit script cannot write the action set, so the loop runs workspace-write on $LOOPS_ROOT — the write POLICY (only the two shipped scripts write, only into this run's dir) is enforced by prompt + artifact review under codex, not by a command allowlist. exec_allowlist kept as the declared policy even though codex cannot pattern-enforce it (§7.2 documented limitation). History: engine was claude 2026-07-28..08-05 precisely because claude's allowlisted-Bash floor was tighter — flip back per-loop if codex output quality falls short. Read-only otherwise: never calls record_and_apply, any ads API, git, or CDP/browser."
