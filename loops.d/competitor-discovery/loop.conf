# competitor-discovery — weekly sweep for competitor candidates not yet in the
# registry. Design of record: maguyva-marketing gc-actions/specs/competitor-profiles.md §2b.
name=competitor-discovery
description="Weekly discovery sweep: GitHub repository search, Tavily web search, Reddit (RedditGrow) and Google results (Firecrawl) for codebase-context / code-intelligence / structural-search tools not yet in competitor-registry.yaml. Prints only unseen candidates; the verdict (accept or reject) is Generalissimo's. Report-only."
owner=maguyva-marketing
type=agent
engine=codex
# model=
schedule=weekly:tue:10:30
# workdir=$LOOPS_ROOT
timeout_s=900
# enabled=true
retention_days=365
# retry_transient=1
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="Floor permissions. GitHub reads use gh auth token -u ytubecoder (own account, read-only GETs, never printed) when present, else anonymous. All network access (GitHub search, Tavily web search, RedditGrow, Firecrawl Google search) happens in precheck.sh via scripts/competitor-discovery.py, which is unsandboxed and not governed by these axes (docs/LOOP_AUTHORING.md section 4). The script reads the Tavily key itself from the exact field mcp_servers.tavily.env.TAVILY_API_KEY, and the Firecrawl key from mcp_servers.firecrawl.env.FIRECRAWL_API_KEY, both in ~/.codex/config.toml, and never prints them, so credential_env stays empty (hard-disabled in v1). The engine only labels a short printed list of candidates and needs no network, exec, or remote write. Writes outside $OUT_DIR are limited to this loop's own cache/seen.json."
# requires=
