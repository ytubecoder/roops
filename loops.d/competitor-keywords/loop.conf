# competitor-keywords — monthly Keyword Planner scan of every tracked competitor
# page plus brand-term search volume for every registry row (tracked and watch).
# Design of record: maguyva-marketing/gc-actions/specs/competitor-profiles.md §2a.
name=competitor-keywords
description="Monthly Google Keyword Planner scan of competitor pages and brand names: new/dropped shared-gap keywords (3+ competitors, not us), brand search volume moves of 25% or more, and changes to the keyword set our own pages attract. Read-only Google Ads API; report-only."
owner=maguyva-marketing
type=agent
engine=codex
schedule=monthly:03:21:00
timeout_s=900
retention_days=365
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
notes="Permission floor: report_only/none/none/none. precheck.sh sources $MAGUYVA_REPO/.env (default ~/projects/maguyva-marketing) for the Google Ads OAuth env and runs google-ads-tools/competitor-keyword-scan.py with --out \"$OUT_DIR/keyword-scan\". Those calls are read-only Keyword Planner RPCs (GenerateKeywordIdeas, GenerateKeywordHistoricalMetrics) plus GAQL constant lookups; the credential values are never printed and the precheck is unsandboxed and not governed by the axes (LOOP_AUTHORING section 4). The engine itself needs no network, no shell and no credential: it only reads the printed diff. Cross-run memory is the loop's own cache/summary.json (competitor-watch convention)."
requires="bin:python3"
