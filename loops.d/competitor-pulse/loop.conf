name=competitor-pulse
description="Weekly competitor pulse: GitHub stars and releases, package downloads, Hacker News and Reddit mentions, news and website text changes for every tracked or watched registry competitor, plus a light news/Reddit pass over up to 8 unverdicted discovery candidates."
owner=maguyva-marketing
type=agent
engine=codex
schedule=weekly:mon:11:30
timeout_s=1200
retention_days=365
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
notes="Floor permissions on purpose: precheck.sh (collect.py) performs every network read itself, anonymous except one Tavily search per tracked competitor (key read from the exact ~/.codex/config.toml field, never printed) and one RedditGrow /reddit/search per competitor (REDDITGROW_API_KEY lifted from the repo .env by precheck.sh, never printed). Since 2026-10-24 it also GETs up to 3 seed_urls per tracked row (website text diff) and, for at most 8 unverdicted competitor-discovery candidates, one homepage GET, one Tavily and one RedditGrow search each: about 30 RedditGrow calls (limit 100/hour) and 20 Tavily searches per firing. GitHub calls are read-only public-metadata GETs under Generalissimo's own ytubecoder account via gh auth token (same pattern as dev-asks-watch). The engine only interprets the precheck block, so it needs no network, exec or write access."
requires=bin:python3,bin:gh
