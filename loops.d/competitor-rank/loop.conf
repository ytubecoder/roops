name=competitor-rank
description="Weekly relevance ranking of every registry competitor and open discovery candidate on features, price, positioning and sentiment, from the competitor-pulse, gtm-research voice and registry data; no network."
owner=maguyva-marketing
type=agent
engine=codex
schedule=weekly:mon:12:30
timeout_s=900
retention_days=365
precheck_cap_bytes=196608
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
notes="Floor permissions on purpose: precheck.sh (assemble.py) only reads local files (the competitor registry, the newest competitor-pulse pulse.json, the competitor-pulse, gtm-research and competitor-rank promoted latest.json) and writes rank-input.json into its own run dir. No network anywhere. Runs at 12:30, an hour after competitor-pulse (Mon 11:30, under 10 minutes). The engine only scores the precheck block."
requires=bin:python3
