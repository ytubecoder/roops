# competitor-watch — monthly standing watch on five competitive threats plus a
# dependent backlink-gap watch (ticket B-27, gc-actions/specs/B-27.md).
# Design: gc-actions/deliverables/B-27/loop-design.md. Two deviations from
# that design's literal wording, both documented in full in this loop's
# SPEC.md §3/§7 and precheck.sh's header: watch 4 uses a sitemap-URL-match
# proxy instead of the tavily API (credential_env is hard-disabled in this
# harness's v1 — no launchd-env passthrough exists), and cross-run diffing
# uses a self-contained cache/ dir instead of a prior-OUT_DIR lookup (no such
# mechanism is documented in this harness). Watch 5 (Ref Plans depth creep)
# was added 2026-09-18, out-of-band from B-27's original design, following
# the same conventions; the backlink-gap watch shifted from watch 5 to 6.
name=competitor-watch
description="Monthly watch on Sourcegraph/Amp self-serve re-entry, editor/CLI-native context, OSS local-indexer traction, Augment SEO encroachment, and Ref Plans depth creep, plus a dependent backlink-gap watch (inert until B-23 lands a GSC Links export). Report-only, no paid API, no browser automation."
owner=maguyva-marketing
type=agent
engine=codex
# model=
schedule=monthly:01:20:30
# workdir=$LOOPS_ROOT
timeout_s=900
# enabled=true
retention_days=730
# retry_transient=1
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="perm_fs_write stays at the report_only floor rather than the design doc's literal 'workdir' — this loop's engine never needs to write its own files (no emit-script pattern like ads-x); all real writing is precheck.sh's own cache/ diffing, which is unsandboxed and ungoverned by these axes per docs/LOOP_AUTHORING.md §4. Watch 4 (Augment SEO encroachment) uses a sitemap-URL-match proxy instead of live SERP data via tavily, since credential_env is reserved/hard-disabled in v1 (docs/INTERFACES.md §5 rule 8) and a launchd precheck.sh has no supported way to receive an API key. Watch 5 (Ref Plans depth creep, added 2026-09-18) uses the same report_only/no-network-for-the-engine shape as the original four; it needs no credential either. Backlink-gap watch (6) ships declared-but-inert per the design doc, dependent on B-23."
# requires=
