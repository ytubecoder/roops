# dapodcast-henshu (編集, "editing") — run the podcast-feedback-editor skill on
# new author feedback from https://dapodcast.pages.dev and publish the result.
# Design: directorsactorspodcast docs/superpowers/specs/2026-09-30-feedback-loop-design.md
# (CR-61). The ONLY loop whose engine performs production writes: owner
# sign-off 2026-09-30, recorded in SPEC.md §7 and docs/OPEN_THREADS.md §1.
# Every mutation (reply POSTs, git push to main, Pages deploy) happens inside
# the project's deterministic tools/feedback-publish.sh, which the engine calls
# as its last step; the engine itself only edits the checkout.
name=dapodcast-henshu
description="Editorially process new author feedback on the podcast brief site and publish it"
owner=directorsactorspodcast
type=agent
engine=codex
# model=
schedule=interval:1h
workdir=~/projects/directorsactorspodcast
timeout_s=3600
retry_transient=1
requires="os:linux,bin:git,bin:curl,bin:ssh,file:~/.local/node/bin/node,file:~/.local/venvs/dapodcast/bin/python,file:~/.ssh/dapodcast-deploy,file:~/.config/dapodcast/cloudflare.env,file:~/projects/directorsactorspodcast/tools/feedback-publish.sh"
tags=dapodcast,editorial
perm_fs_write=workdir
perm_network=full
perm_local_exec=full
i_accept_unrestricted=true
perm_remote_mutation=allowlist
exec_allowlist="tools/feedback-publish.sh,tools/revert-run.sh,./tools/build.sh,node tools/review-feedback-scan.mjs,node --test,bash tests/acceptance/verify.sh"
remote_mutation_justification="Owner-approved (2026-09-30) full autonomy for author-feedback editorial runs: posts bilingual editorial replies to the site's own review API, pushes main of ytubecoder/directorsactorspodcast with a repo-scoped deploy key, and deploys the Cloudflare Pages project dapodcast with a Pages-scoped token. All three happen only inside tools/feedback-publish.sh, which is idempotent, resumable, and runs build+tests before anything is posted."
notes="workdir = the loop's dedicated firstparty checkout of directorsactorspodcast (never shared, always main); the engine edits briefs/Polish/CR/archive there and writes the editorial manifest. network+exec are needed for the publish script it calls. See SPEC.md §7."
