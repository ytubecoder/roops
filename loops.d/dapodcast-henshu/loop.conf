# dapodcast-henshu (編集, "editing") — run the podcast-feedback-editor skill on
# new author feedback from https://dapodcast.pages.dev and publish the result.
# Design: directorsactorspodcast docs/superpowers/specs/2026-09-30-feedback-loop-design.md
# (CR-61). Owner sign-off for autonomous production writes: 2026-09-30, SPEC.md §7.
# Script -> agent -> script: every mutation (reply POSTs, git push to main,
# Pages deploy) happens in precheck.sh via the project's deterministic
# tools/feedback-publish.sh, publishing the pass the engine prepared on the
# previous firing. The engine edits its checkout offline: codex's sandbox
# cannot write .git, and it holds no network or credentials.
name=dapodcast-henshu
description="Editorially process new author feedback on the podcast brief site and publish it"
owner=directorsactorspodcast
type=agent
engine=codex
# model=
schedule=interval:15m
workdir=~/projects/directorsactorspodcast
timeout_s=3600
retry_transient=1
requires="os:linux,bin:git,bin:curl,bin:ssh,file:~/.local/node/bin/node,file:~/.local/venvs/dapodcast/bin/python,file:~/.ssh/dapodcast-deploy,file:~/.config/dapodcast/cloudflare.env,file:~/projects/directorsactorspodcast/tools/feedback-publish.sh"
tags=dapodcast,editorial
perm_fs_write=workdir
perm_network=none
perm_local_exec=full
perm_remote_mutation=none
notes="workdir = the loop's dedicated firstparty checkout of directorsactorspodcast (never shared, always main); the engine edits briefs/Polish/CR/archive there and writes the editorial manifest, offline. Remote mutations are in precheck.sh (trusted code), justified in SPEC.md §7."
