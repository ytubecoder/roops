# dapodcast-mamori (守り, "protection") — back up the production review store of
# https://dapodcast.pages.dev into git. type=watchdog: precheck.sh IS the job and
# needs no engine. It reads the public GET /api/review/state (no credentials),
# writes backups/production/ via the project's tools/backup-production.mjs, and
# commits + pushes main only when something changed. Engine at the floor.
name=dapodcast-mamori
description="Back up the podcast site's production notes and on-site wording into git"
owner=directorsactorspodcast
type=watchdog
engine=codex
schedule=interval:1h
timeout_s=600
requires="os:linux,bin:git,bin:curl,file:~/.local/node/bin/node,file:~/.ssh/dapodcast-deploy,file:~/projects/dapodcast-backup/tools/backup-production.mjs"
tags=dapodcast,backup
notes="Remote mutation (git push of backups/production/ to ytubecoder/directorsactorspodcast main) lives in trusted precheck code using the repo-scoped deploy key, same sign-off as dapodcast-henshu (SPEC.md there, §7). Engine only diagnoses failures."
