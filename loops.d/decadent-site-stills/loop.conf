# decadent-site-stills: keeps the Decadent public site's machine-screen stills and DE1 hero in step with
# the app on main. Replaces the daily render in decadent's .github/workflows/site-stills.yml (owner,
# 2026-11-15: "you should use my loop runner because thats what its there for").
# type=watchdog: precheck.sh IS the job. It renders only when origin/main has moved, so a quiet night is a
# git fetch and zero tokens. The engine runs only when the stills cannot be made or a caption broke.
name=decadent-site-stills
description="Re-make decadent's site stills + DE1 hero from main when it moves; push site/stills-refresh so GitHub opens the review PR. Nightly 03:00; a quiet night costs a git fetch."
owner=decadent
type=watchdog
engine=codex
# model=
# Nightly, not hourly (owner, 2026-11-16: "once daily (probably overnight)"). firstparty is Asia/Manila.
schedule=daily:03:00
timeout_s=600
retention_days=90
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
notes="Engine at the report-only floor on all four axes; it only reads the precheck output. The one remote mutation (git push -f of site/stills-refresh on ytubecoder/decadent, never main) lives in trusted precheck code through the repo-scoped deploy key ~/.ssh/decadent-deploy (kagami/vecomap precedent). The PR itself is opened by decadent's site-stills workflow from that push, so svc holds no GitHub token. Chromium's missing system libraries and cwebp are unpacked from Debian .debs under ~/.local/opt/chromium-libs (svc has no sudo). See SPEC.md 7."
requires="os:linux,bin:git,bin:node,bin:npm,file:~/.ssh/decadent-deploy,file:~/projects/decadent/scripts/stills-refresh.sh,file:~/.cache/decadent-stills/venv/bin/python,file:~/.local/opt/chromium-libs/root/usr/bin/cwebp"
tags=decadent,site
