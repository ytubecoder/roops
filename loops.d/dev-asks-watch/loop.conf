# dev-asks-watch — daily read-only watch on the issues and PRs our work
# account (tomokagami = tom@utbox.net) has filed in Synacy/maguyva-frontend
# and Synacy/rise-data-platform, the two repos the Maguyva developers answer
# in. Precheck reads via gh, diffs against cache/, prints only changes; the
# engine writes the changes up. A quiet day is skipped-precheck, zero tokens.
# Built 2026-10-07 after frontend#711 (Generalissimo: "if we don't have a
# loop runner to keep track of our issues we should"). Recipe for filing the
# asks it watches: maguyva-marketing/workflows/file-dev-issue.txt.
name=dev-asks-watch
description="Daily read-only watch on every issue/PR our work account filed in Synacy/maguyva-frontend and Synacy/rise-data-platform: developer replies, closes, merges, stale asks. Precheck diffs against a cache and the engine only writes up changes."
owner=maguyva-marketing
type=agent
engine=codex
# model=
# 09:30 local — after gc-health-watch (09:15) so the morning reads arrive together.
schedule=daily:09:30
timeout_s=300
retention_days=365
# retry_transient=1

# --- Permission axes (docs/LOOP_AUTHORING.md §4) — the report-only floor ---
# All GitHub reads happen in precheck.sh (unsandboxed, ungoverned by these
# axes); the engine never touches the network or a shell.
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="Permission floor: report_only/none/none/none. The only credential is the gh CLI's stored token for the tomokagami account, read by precheck.sh via `gh auth token -u tomokagami` on the loop host (llm) and used for read-only `gh issue list` / `gh pr list` calls — the standing read-only exception for our own filed asks (memory feedback_never_use_utbox_github_unasked). The loop never posts, comments, closes or reacts. Cross-run memory is the loop's own cache/snapshot.json (competitor-watch convention)."
requires="bin:gh,bin:jq,bin:python3"
