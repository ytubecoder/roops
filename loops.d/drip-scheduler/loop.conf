# drip-scheduler — the always-on clock for maguyva drip campaigns.
#
# Every 15 minutes the precheck calls probe:drip-tick on llm, which runs one
# growth-console drip tick: reconcile mailbox@ (replies, bounces, unsubscribes),
# apply them to enrollments, then send the due emails of campaigns the operator
# turned ON in the GC Drips tab. No model decides or sends anything: a quiet
# tick is a zero-token green heartbeat; the engine only writes up failures.
name=drip-scheduler
owner=maguyva-marketing
description="Always-on drip campaign clock: every 15 min runs the GC drip tick on llm (reconcile mailbox, send due emails of campaigns turned ON in the Drips tab). Quiet = heartbeat; failures, auto-off and transport errors become findings."
type=watchdog
engine=codex
schedule=interval:15m
timeout_s=900
requires="probe:drip-tick"
retention_days=90

perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=allowlist
exec_allowlist="bin/probe drip-tick"
remote_mutation_justification="Sends drip campaign emails from mailbox@maguyva.ai, and only for campaigns Generalissimo has turned ON in the GC Drips tab. Narrow amendment to the standing loops-never-send rule, granted 2026-10-05 (maguyva-marketing openspec/changes/drip-campaigns, design decision 7). Every gate lives in growth-console, not here: campaign on/off + on-version pin, DRIP_SEND_ENABLED kill switch in the repo .env, single-run lock, canary of 5 per email held until a mailbox reconcile, auto-off on canary bounce or a >=3% bounce tick. The engine never calls the probe; the precheck does."
notes="Kill switches, in order of reach: (1) turn a campaign off in GC /drips; (2) DRIP_SEND_ENABLED=0 in maguyva-marketing/.env stops every drip send while ticks keep reconciling; (3) loopctl set-schedule drip-scheduler manual stops the clock. Do NOT use the research-replies loop for this — that loop is read-only and must stay so. A quiet tick exits 0 (heartbeat, no tokens)."
