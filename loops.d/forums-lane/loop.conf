# forums-lane — daily lurk, assess, draft. Nothing is posted.
# Runs on firstparty. Not installed by this packet. Install only after a
# supervised `loopctl run forums-lane` and the section 13 smoke in the
# forums-lane design. Schedule is local time (LOOPS_EXPECT_TZ=Asia/Manila):
# 07:10 stays 07:10 so this run and the legacy llm lane at 08:40 do not
# share a clock hour (design section 11).
name=forums-lane
owner=maguyva-marketing
description="Daily forum lurk: collect candidates, assess them, draft the top tier, and hand a batch to Growth Console. Never posts, votes, messages, or submits."
type=agent
engine=codex
# model=  # codex engine default

schedule=daily:07:10

# workdir=$LOOPS_ROOT
timeout_s=900
requires="env:GC_BASE, bin:curl, env:MAGUYVA_REPO"
retention_days=180
# retry_transient=1

# --- Permission axes (INTERFACES.md §5.2) ---
# workdir (not the report_only floor) because engine=codex: codex report_only
# maps to a read-only sandbox, under which emit could not write
# $OUT_DIR/loop-data.commit/batch.json. Same reason as ads-google.
# No network for the engine — the unsandboxed precheck fetches.
# No remote mutation, ever. Emit only validates and writes the run dir.
perm_fs_write=workdir
perm_network=none
perm_local_exec=allowlist
perm_remote_mutation=none
# `:*` allows the heredoc and --out-dir. Codex cannot pattern-enforce this
# (INTERFACES §7.2); the line is the declared policy, as on ads-google.
exec_allowlist="$HOME/.venvs/forums/bin/python -m console.forums emit:*"
# credential_env is RESERVED. loopctl validate rule 8 hard-fails any
# non-empty value (docs/INTERFACES.md §5). Do not uncomment it.
# The precheck inherits these names from the loops .env. The runner strips
# that file from the engine. Names only, never values:
# REDDITGROW_API_KEY REDDIT_CLIENT_ID REDDIT_CLIENT_SECRET REDDIT_USERNAME REDDIT_PASSWORD
# credential_env=
# remote_mutation_justification=
notes="perm_fs_write=workdir because engine=codex maps report_only to a read-only sandbox, and emit must write the batch under this run dir (same reason as ads-google). perm_network=none: the unsandboxed precheck fetches; the engine does not. perm_remote_mutation=none. exec_allowlist is the emit command only. credential_env stays empty because validate rule 8 hard-fails a non-empty value; the five read-only key names are comments above and live in the loops .env for the precheck."
