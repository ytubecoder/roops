# gc-actions — weekly GC action-register → ticket-takeaway reconciliation.
# Automates the 2026-08-11/12 manual collation (39-row approval artifact in
# maguyva-marketing/.lavish/action-ticket-approval.html): precheck gathers every
# action register of sources registered in gc-actions/action-sources.yaml (DMP +
# CRO today) + the action↔ticket map + the maguyva-actions board;
# the engine judges coverage gaps and data conflicts; the post-promotion
# render.sh hook applies create_ticket ops idempotently via tickets-cli so new
# proposals land in the board's IDEAS section as Generalissimo's assessment
# queue. Nothing auto-approves, nothing auto-strikes — dispositions stay human
# (loopctl ack/dismiss/snooze + ticket triage in ticket-takeaway).
name=gc-actions
owner=maguyva-marketing
description="Weekly reconciliation of the action registers of sources registered in gc-actions/action-sources.yaml (DMP + CRO today) against the maguyva-actions ticket board: flags open actions with no ticket coverage and register/map conflicts; promoted create_ticket proposals are applied post-promotion into the board's Ideas section for Generalissimo's triage. Report/propose at engine level; ticket creation happens only in the harness-trusted render.sh hook, only for promoted (unsuppressed) findings."
type=agent
# engine=codex per Generalissimo's standing 2026-08-05 engine call (claude
# tokens are reserved for development; codex file auth works under launchd).
engine=codex
# model=  # codex engine default

# Cadence: weekly Monday 20:00 local (Mac TZ = Asia/Manila) = Monday 08:00 ET,
# AFTER the daily ads-loop stagger (18:00–19:40 Manila) so the launchd windows
# never overlap. Weekly per Generalissimo's approved Q2 design 2026-08-12.
# Missed firings coalesce to one at wake (INTERFACES §5.1) — fine for a weekly
# reconciliation; staleness expectation is 7d.
schedule=weekly:mon:20:00

timeout_s=900
requires="probe:dmp-actions, probe:gc-actions-files, probe:ticket-add"
# Keep a long audit trail of proposals — the runs ARE the record of what the
# robot suggested and when.
retention_days=365
# retry_transient=1

# --- Permission axes: the report-only FLOOR, deliberately. ---
# The engine only INTERPRETS precheck's deterministic digest and emits the
# contract; it needs no shell, no network, no writes (codex report_only =
# read-only sandbox, which is exactly right here). The ticket-writing side
# effect lives OUTSIDE the engine in render.sh (runner-invoked, unsandboxed,
# post-promotion — INTERFACES §4.1 step 6.5), which runs bin/apply_tickets.py
# against the PROMOTED latest.json only: a run that fails validation or gets
# suppressed findings never creates tickets, and dismissed findings are
# mechanically excluded because the runner filters them out of latest.json
# before render.sh ever sees it.
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
notes="Ticket creation is a render.sh post-promotion side effect (approved Q2 design 2026-08-12, spec maguyva-marketing/docs/superpowers/specs/2026-07-25-dmp-actions-pipeline-design.md): apply_tickets.py reads the promoted latest.json, applies ONLY create_ticket ops from unsuppressed findings, dedupes against gc-actions/action-ticket-map.yaml + the board file, and writes tickets ONLY into the maguyva-actions project's Ideas section via ~/.claude/ticket-takeaway/tickets-cli.py. It never approves, moves, edits, or strikes anything. Engine itself stays at the report-only floor — codex read-only sandbox, no network, no exec."
