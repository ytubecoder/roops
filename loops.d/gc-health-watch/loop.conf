# gc-health-watch — surfaces GC-stack failures that already sit unread on
# the data host: an OpenTwins X-agent logout or stalled Chrome launch cycle,
# Postiz publish errors or a disabled integration, and any GC-tracked routine
# in error or overdue.
#
# Cadence: daily at 09:15 local, right after ads-delivery-watch at 09:00 so
# the two morning alarms arrive together. The X agent checks its own session
# every hour; the only human action on the far side of any finding here (a
# re-login, a Postiz reconnect, a scraper restart) is a same-day chore, so a
# morning read is the useful resolution. Calendar times are LOCAL
# (INTERFACES.md §5.1).
name=gc-health-watch
owner=maguyva-marketing
description="Surfaces failures across the Growth Console stack that already sit unread on the data host: the OpenTwins X agent logged out or its Chrome launch cycle stalled, Postiz publish errors or a disabled integration, and any GC-tracked routine in error or overdue."
type=watchdog
engine=codex
schedule=daily:09:15
timeout_s=300
requires="probe:gc-health-read"
retention_days=365

# --- Permission axes (INTERFACES.md §5.2) ---
# report_only is correct: this loop writes no action set. The probe call
# inside precheck.sh is the job (§4.1) and is not governed by perm_network;
# the engine only ever reads already-captured precheck text.
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none

notes="Precheck gathers the three GC-health sections (schedules, opentwins, postiz) via probe:gc-health-read and the engine only writes up an alarm the precheck has already established. Exclusions: gc cache warmer (in-process only) and ads-* loop rows (fleet state lives on firstparty since 2026-08-23). Permission floor: report_only/none/none/none. The probe runs unsandboxed inside the precheck, which is the job for type=watchdog and is not governed by perm_network."
