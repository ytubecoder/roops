# Scaffolded by `loopctl new gtm-synthesis` on 2026-09-24.
# TODO before installing: pick a real `schedule` (see docs/INTERFACES.md §5.1)
# and fill in `description`. Optional keys below are commented with their
# permissive defaults — uncomment and edit only what this loop needs.
name=gtm-synthesis
description="Daily deterministic refresh of approved GTM audit snapshots, research evidence merge, candidate synthesis, and source health on the llm data host."
owner=maguyva-marketing
type=watchdog
engine=codex
# model=
schedule=daily:10:15
# workdir=$LOOPS_ROOT
timeout_s=180
# enabled=true
retention_days=365
# retry_transient=1
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="Watchdog only: the reviewed gtm-refresh probe performs the llm-local atomic snapshot writes. No model is invoked on success and the engine has no mutation authority."
requires="probe:gtm-refresh"
