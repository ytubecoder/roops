name=gtm-synthesis
description="Daily source-backed GTM assessment of changed anonymized feedback and public research."
owner=maguyva-marketing
type=agent
engine=codex
# model=
schedule=daily:10:15
# workdir=$LOOPS_ROOT
timeout_s=600
# enabled=true
retention_days=365
# retry_transient=1
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="Precheck refreshes bounded local snapshots; the engine interprets anonymized evidence and emits a contract only. GC validates and pulls it read-only."
requires="probe:gtm-refresh,probe:gtm-learning-read"
