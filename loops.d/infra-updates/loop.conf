# infra-updates — daily "what is pending, and is it old enough to apply yet"
# digest for the home estate (sysadmin repo). Report/propose-only: the loop
# never installs anything; a human applies. Policy: ~/projects/sysadmin/update-policy.md
name=infra-updates
description="Daily digest of pending updates across pve1, its guests, media, HAOS and llm, graded against the 7-day hold policy and CISA KEV"
owner=sysadmin
type=agent
engine=codex
# model=
schedule=daily:07:30
# workdir=$LOOPS_ROOT
timeout_s=600
# enabled=true
retention_days=60
# retry_transient=1
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="All network and ssh I/O happens in precheck.sh (plain runner script, read-only commands: apt list, docker ps, ha … info, curl to GitHub/plex.tv/CISA). The engine only interprets the digest, so the report-only floor is enough. precheck prints NOTHING when nothing is pending, so a quiet estate costs zero tokens."
requires="os:darwin, bin:ssh, bin:python3, bin:curl"
