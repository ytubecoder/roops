# kagami (鏡) — mirror check: the published roops mock garden must match the real
# garden UI. Regenerates dashboard/generate.py output from the pinned fixture root,
# byte-compares against the live page, and (drift + all gates green) opens/updates a
# PR against ytubecoder/ytubecoder.github.io. Merge is the human approval gate.
name=kagami
description="public mock-garden mirror: regenerate from pinned fixture, gate, compare live, PR on drift"
owner=loops
type=agent
engine=codex
# model=
schedule=daily:21:30
timeout_s=900
requires="bin:gh, bin:git, bin:shasum, bin:curl"
# enabled=true
# retention_days=30
# retry_transient=1
# Engine stays at the full report-only floor on all four axes (defaults below).
# The ONLY remote mutation (branch+PR to ytubecoder/ytubecoder.github.io) happens in
# precheck.sh — trusted deterministic code, same trust rule as watchdog probes — using
# ~/.config/roops-kagami/pat if present, else ambient gh auth. The engine never holds
# credentials, network, or exec; it interprets precheck's test matrix and nothing else.
# perm_fs_write=report_only
# perm_network=none
# perm_local_exec=none
# perm_remote_mutation=none
# exec_allowlist=
# credential_env=
notes="remote mutation (PR open/update) lives in trusted precheck code, not the engine; engine at floor on all axes. See SPEC.md 7."
