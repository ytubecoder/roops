# loop-sensei — the fleet's examiner (先生): diagnoses loops whose latest run
# failed and proposes fixes as findings. Report-only at the full floor; the
# precheck does all reading (sqlite + state/runs artifacts, local only).
# NOT installed yet — supervised runs only, consistent with the fleet
# (no loop is installed to launchd as of 2026-07-29).
name=loop-sensei
owner=loops
description="Fleet examiner: when another loop's latest run failed, diagnoses why from the run artifacts and proposes a fix as a finding (report-only; healthy fleet costs zero tokens)."
type=agent
engine=codex
# model=  # engine default

# Daily, after the ads stagger (18:00-19:00 local) so it examines today's
# firings. Calendar times are LOCAL (INTERFACES §5.1); missed-while-asleep
# firings coalesce to one at wake, which is fine for a daily examiner.
schedule=daily:20:00

# workdir=$LOOPS_ROOT
# Pure interpretation of an injected digest — no tools, no network. 300s is
# generous; the 900s default would only pad a hang.
timeout_s=300
# enabled=true
# retention_days=30
# retry_transient=1

# --- Permission axes: the report-only floor, nothing raised ---
# The engine interprets precheck output only: no fs beyond its own run dir,
# no network, no shell, nothing remote. The precheck reads sqlite + run dirs
# read-only as a plain runner-invoked script (not governed by these axes).
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="Meta-loop: examines the OTHER loops' latest runs (never itself). Findings are diagnoses + proposed fixes, id = <loop>:<class> precomputed by precheck. Proposals only — it never edits harness code, never runs git, never touches anything outside reading $LOOPS_ROOT state."
