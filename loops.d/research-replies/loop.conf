# research-replies — reads mailbox@maguyva.ai for replies to the founder-led
# user-research email (growth-console/brands/maguyva/outreach/ in
# maguyva-marketing) and surfaces each new reply, bounce batch and
# unsubscribe as a finding. Generalissimo never reads that inbox by hand.
#
# Cadence: every 4 hours for the first week after the send (replies cluster in
# the first 72 h and a same-day human reply to a 1-5 answer is the point).
# After ~2026-10-01 switch to `daily:09:30` and reinstall.
name=research-replies
owner=maguyva-marketing
description="Surfaces new replies, bounces and unsubscribes to the user-research email in mailbox@maguyva.ai as findings; the probe keeps user-research-replies.csv and the send-list unsubscribe marks on llm."
type=agent
engine=codex
schedule=interval:4h
timeout_s=300
requires="probe:research-replies-read"
retention_days=365

# --- Permission axes (INTERFACES.md §5.2) --- floor. The IMAP read and the
# CSV bookkeeping happen inside the probe on llm (trusted, reviewed code);
# the engine only interprets already-captured, capped text.
perm_fs_write=report_only
perm_network=none
perm_local_exec=none
perm_remote_mutation=none

notes="Precheck calls probe:research-replies-read (IMAP BODY.PEEK only: never marks read, never replies, never deletes). The probe appends new replies to user-research-replies.csv keyed by IMAP UID, marks unsubscribed send-list rows, and moves a UID cursor under state/research-replies/. Empty precheck (nothing new) = skipped-precheck, zero tokens. The engine never sends the optional follow-up question; it only flags that the decision is open."
