# tailnet-zones — regenerates the tailnet zone diagram page from the actual
# Tailscale policy so the served diagram can never drift from what is enforced.
name=tailnet-zones
description="Rebuilds the tailnet zone diagram page from the live Tailscale policy (read-only API when a credential is present, repo snapshot otherwise) and reports sync drift"
owner=network-system
type=agent
engine=codex
schedule=daily:08:10
timeout_s=300
# Floor permissions on every axis (defaults): report_only / none / none / none.
# The policy read (GET /acl, read-only) and all page-model building happen in
# trusted precheck; the engine only interprets the digest. The page renders in
# render.sh from the captured model — no network, no mutation anywhere.
notes="Read-only by construction: precheck GETs the policy with an optional read-scoped credential (~/.config/tailscale-policy-read.token; snapshot fallback without it) and never POSTs. Inventory + prose come from the tailnet-setup repo's zones-meta.json — tailnet specifics stay out of this (pushed) repo."
