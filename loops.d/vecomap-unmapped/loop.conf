# vecomap-unmapped — trace VECO unmapped-area images and push candidate
# branches. type=agent: precheck.sh IS the job (INTERFACES §4.1).
# Engine stays at the report-only floor on all four axes (defaults below).
# The ONLY remote mutation (git push of a tracer/<YYYYMMDD-HHMM> branch on
# ytubecoder/vecomap) happens in precheck.sh — trusted deterministic code,
# kagami precedent — using the checkout's existing github-vecomap deploy-key
# remote. The engine never holds credentials, network, or exec; it turns
# summary.json into contract findings and a 5-line report_markdown.
name=vecomap-unmapped
description="Trace VECO's unmapped area images into estimated polygons and push candidate branches"
owner=vecomap
type=agent
engine=codex
# model=
schedule=times:07:40,19:40
timeout_s=2400
requires="os:linux,bin:git,bin:curl,bin:ssh,env:VECOMAP_ADMIN_SECRET,env:VECOMAP_API_BASE,file:~/projects/vecomap/tools/area-tracer/pyproject.toml,file:~/.cache/vecomap-tracer/venv/bin/python,file:~/.cache/vecomap-tracer/cebu_named_ways.json,file:~/.cache/vecomap-tracer/cebu_pois.json,file:~/.ssh/vecomap-deploy"
tags=vecomap,tracer
# enabled=true
# retention_days=30
# retry_transient=1
# Engine at the full report-only floor on all four axes (defaults).
# perm_fs_write=report_only
# perm_network=none
# perm_local_exec=none
# perm_remote_mutation=none
# exec_allowlist=
# credential_env=
# remote_mutation_justification=
notes="remote mutation (git push of tracer/<YYYYMMDD-HHMM> on ytubecoder/vecomap) lives in trusted precheck code, not the engine; engine at floor on all axes. Loop never opens or merges PRs and never touches main. See SPEC.md 7."
