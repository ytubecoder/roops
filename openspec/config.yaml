context: |
  Custom thin harness for recurring report-only agent "loops" run via launchd.
  Stack: Python 3 (stdlib only, sqlite3) + bash. No third-party runtime deps.

  Read these before proposing anything — they are the authority, not this block:
    CLAUDE.md            project conventions and gotchas
    docs/INTERFACES.md   FROZEN contract. Harness internals change only per this.
    docs/LOOP_AUTHORING.md  how a loop is built (intake interview -> SPEC.md)

  Conventions:
    - Loops are report-only; enforcement lives in the runner, never in the model.
    - Tests are hermetic: tests/run-tests.sh must pass with no network.
    - macOS-safe shell only (no GNU-only flags).
